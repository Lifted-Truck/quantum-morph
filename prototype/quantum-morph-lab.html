<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Morph Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --chassis:#131218;
  --panel:#1b1a22;
  --panel-2:#22212b;
  --hair:#332f3f;
  --ink:#ded9ea;
  --muted:#8b8499;
  --A:#f2b134;
  --B:#ff4d6d;
  --C:#4cc9f0;
  --D:#7ae582;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--chassis);color:var(--ink);font-family:var(--disp)}
body{padding:22px;max-width:1280px;margin:0 auto}
h1{font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin:0}
.sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.02em}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:1px solid var(--hair);padding-bottom:14px;margin-bottom:18px}
#start{font-family:var(--mono);font-size:12px;padding:10px 18px;background:var(--ink);color:var(--chassis);border:0;border-radius:2px;cursor:pointer;letter-spacing:.08em;font-weight:600}
#start[disabled]{background:var(--panel-2);color:var(--muted);cursor:default}
.top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media(max-width:900px){.top{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--hair);border-radius:3px;padding:14px}
.plabel{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* ---- pad ---- */
.padwrap{position:relative;width:100%;aspect-ratio:1;max-width:520px;margin:0 auto;touch-action:none}
canvas{width:100%;height:100%;display:block;border-radius:2px;cursor:crosshair}
.census{display:flex;height:16px;margin-top:12px;border-radius:2px;overflow:hidden;background:var(--panel-2)}
.census div{transition:width .18s linear;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:rgba(0,0,0,.75);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend b{font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* ---- controls ---- */
.ctl{margin-bottom:13px}
.ctl label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;text-transform:uppercase}
.ctl label span{color:var(--ink)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:2px;background:var(--hair);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--ink);cursor:pointer}
input[type=range]:focus-visible{outline:1px solid var(--C);outline-offset:4px}
.seg{display:flex;gap:0;border:1px solid var(--hair);border-radius:2px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;color:var(--muted);font-family:var(--mono);font-size:10px;padding:6px 2px;cursor:pointer;letter-spacing:.04em}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--ink)}
.seg button:focus-visible{outline:1px solid var(--C);outline-offset:-2px}
.btn{width:100%;background:var(--panel-2);border:1px solid var(--hair);color:var(--ink);font-family:var(--mono);font-size:11px;padding:9px;border-radius:2px;cursor:pointer;letter-spacing:.06em}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:1px solid var(--C);outline-offset:2px}
.row{display:flex;gap:8px}
.hint{font-family:var(--mono);font-size:9.5px;color:var(--muted);line-height:1.5;margin-top:9px}
.pending{font-family:var(--mono);font-size:10px;color:var(--A);margin-top:8px;min-height:14px}

/* ---- params ---- */
.rack{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.group{background:var(--panel);border:1px solid var(--hair);border-radius:3px;padding:11px}
.gname{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--muted);margin-bottom:9px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 7px;margin-bottom:3px;border-radius:2px;border-left:3px solid transparent;background:var(--panel-2);cursor:pointer;position:relative}
.chip:hover{background:#2a2934}
.chip[data-sel=true]{outline:1px solid var(--muted)}
.chip .n{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.03em}
.chip .v{font-family:var(--mono);font-size:10.5px;font-weight:500;text-align:right}
.chip.flash{animation:fl .42s ease-out}
@keyframes fl{0%{background:rgba(255,255,255,.28)}100%{background:var(--panel-2)}}
@media(prefers-reduced-motion:reduce){.chip.flash{animation:none}.census div{transition:none}}

/* ---- keys ---- */
.keys{display:flex;gap:2px;margin-top:16px;height:56px}
.key{flex:1;border:1px solid var(--hair);background:var(--panel);border-radius:0 0 2px 2px;cursor:pointer;padding:0}
.key.blk{background:#0d0c11}
.key[aria-pressed=true]{background:var(--ink)}
.key:focus-visible{outline:1px solid var(--C);outline-offset:-2px}
footer{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:18px;line-height:1.7;border-top:1px solid var(--hair);padding-top:12px}
kbd{font-family:var(--mono);background:var(--panel-2);border:1px solid var(--hair);border-radius:2px;padding:1px 4px;font-size:9.5px}
</style>

<header>
  <div>
    <h1>Quantum Morph Lab</h1>
    <div class="sub">22 parameters · 4 corner patches · stochastic flip morphing</div>
  </div>
  <button id="start">Start audio</button>
</header>

<div class="top">
  <div class="panel">
    <div class="plabel">Morph field <span id="terrlbl" style="float:right;text-transform:none;letter-spacing:0"></span></div>
    <div class="padwrap"><canvas id="pad"></canvas></div>
    <div class="census" id="census"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="panel">
    <div class="plabel">Flip engine</div>
    <div class="ctl"><label>Temperature <span id="tv">1.00</span></label><input type="range" id="temp" min="0.05" max="3" step="0.01" value="1"></div>
    <div class="ctl"><label>Module coupling <span id="cv">30%</span></label><input type="range" id="coup" min="0" max="1" step="0.01" value="0.3"></div>
    <div class="ctl"><label>Flip glide <span id="gv">8 ms</span></label><input type="range" id="glide" min="0" max="60" step="1" value="8"></div>

    <div class="ctl"><label>Continuous params</label>
      <div class="seg" id="contmode"><button data-v="quantum" aria-pressed="true">Quantum</button><button data-v="morph" aria-pressed="false">Morph</button></div></div>

    <div class="ctl"><label>Flip timing</label>
      <div class="seg" id="timing"><button data-v="now" aria-pressed="true">Immediate</button><button data-v="note" aria-pressed="false">Next note</button></div></div>

    <div class="ctl"><button class="btn" id="reshuffle">Reshuffle · seed <span id="seedv">1024</span></button></div>
    <div class="ctl"><label>Auto-reshuffle <span id="arv">off</span></label><input type="range" id="arate" min="0" max="12" step="1" value="0"></div>
    <div class="ctl"><label>Reshuffle depth <span id="advv">25%</span></label><input type="range" id="adepth" min="0.05" max="1" step="0.05" value="0.25"></div>

    <div class="plabel" style="margin-top:18px">Player</div>
    <div class="ctl"><div class="seg" id="arp"><button data-v="on" aria-pressed="true">Arp on</button><button data-v="off" aria-pressed="false">Sustain</button></div></div>
    <div class="ctl"><label>Tempo <span id="bv">108 bpm</span></label><input type="range" id="bpm" min="50" max="170" step="1" value="108"></div>
    <div class="ctl"><label>Volume <span id="vv">70%</span></label><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7"></div>
    <div class="row"><button class="btn" id="panic">All notes off</button></div>
    <div class="pending" id="pend"></div>
    <div class="hint">Click a parameter to draw its territory on the field. Drag the field to morph.</div>
  </div>
</div>

<div class="rack" id="rack"></div>
<div class="keys" id="keys"></div>
<footer>
  <span id="fnote">Press <kbd>Start audio</kbd>, latch a few keys, then drag the field. Computer keys <kbd>a</kbd>–<kbd>k</kbd> latch notes; <kbd>r</kbd> reshuffles.</span>
</footer>

<script>
'use strict';

/* ============================ corners & presets ============================ */
const CORNERS=[
 {id:'A',name:'GLASS', color:'#f2b134'},
 {id:'B',name:'GRIT',  color:'#ff4d6d'},
 {id:'C',name:'HOLLOW',color:'#4cc9f0'},
 {id:'D',name:'BLOOM', color:'#7ae582'}];
// pad geometry: A top-left, B top-right, C bottom-left, D bottom-right

const PARAMS=[
 {id:'waveA', mod:'OSC A', label:'wave',   t:'d', opts:['sine','triangle','sawtooth','square']},
 {id:'octA',  mod:'OSC A', label:'octave', t:'d', opts:[-24,-12,0,12], fmt:v=>(v>0?'+':'')+(v/12)},
 {id:'levA',  mod:'OSC A', label:'level',  t:'c', min:0,max:1, fmt:v=>Math.round(v*100)+'%'},
 {id:'waveB', mod:'OSC B', label:'wave',   t:'d', opts:['sine','triangle','sawtooth','square']},
 {id:'octB',  mod:'OSC B', label:'octave', t:'d', opts:[-24,-12,0,12], fmt:v=>(v>0?'+':'')+(v/12)},
 {id:'detB',  mod:'OSC B', label:'detune', t:'c', min:-45,max:45, fmt:v=>v.toFixed(0)+'ct'},
 {id:'levB',  mod:'OSC B', label:'level',  t:'c', min:0,max:1, fmt:v=>Math.round(v*100)+'%'},
 {id:'fType', mod:'FILTER',label:'type',   t:'d', opts:['lowpass','highpass','bandpass'], fmt:v=>({lowpass:'LP',highpass:'HP',bandpass:'BP'})[v]},
 {id:'cutoff',mod:'FILTER',label:'cutoff', t:'c', min:120,max:11000, log:1, fmt:v=>v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)+''},
 {id:'res',   mod:'FILTER',label:'reso',   t:'c', min:.4,max:22, fmt:v=>v.toFixed(1)},
 {id:'fEnv',  mod:'FILTER',label:'env amt',t:'c', min:-3000,max:7000, fmt:v=>(v>0?'+':'')+Math.round(v/100)/10+'k'},
 {id:'atk',   mod:'ENV',   label:'attack', t:'c', min:.002,max:1.2, log:1, fmt:v=>Math.round(v*1000)+'ms'},
 {id:'dec',   mod:'ENV',   label:'decay',  t:'c', min:.02,max:2, log:1, fmt:v=>Math.round(v*1000)+'ms'},
 {id:'sus',   mod:'ENV',   label:'sustain',t:'c', min:0,max:1, fmt:v=>Math.round(v*100)+'%'},
 {id:'rel',   mod:'ENV',   label:'release',t:'c', min:.03,max:2.5, log:1, fmt:v=>Math.round(v*1000)+'ms'},
 {id:'lfoDest',mod:'LFO',  label:'dest',   t:'d', opts:['off','pitch','cutoff','level']},
 {id:'lfoRate',mod:'LFO',  label:'rate',   t:'c', min:.08,max:14, log:1, fmt:v=>v.toFixed(2)+'Hz'},
 {id:'lfoDepth',mod:'LFO', label:'depth',  t:'c', min:0,max:1, fmt:v=>Math.round(v*100)+'%'},
 {id:'drive', mod:'FX',    label:'drive',  t:'c', min:0,max:1, fmt:v=>Math.round(v*100)+'%'},
 {id:'dlyTime',mod:'FX',   label:'dly time',t:'c',min:.04,max:.55, log:1, fmt:v=>Math.round(v*1000)+'ms'},
 {id:'dlyFb', mod:'FX',    label:'dly fb', t:'c', min:0,max:.78, fmt:v=>Math.round(v*100)+'%'},
 {id:'dlyMix',mod:'FX',    label:'dly mix',t:'c', min:0,max:.6, fmt:v=>Math.round(v*100)+'%'}];

const MODS=[...new Set(PARAMS.map(p=>p.mod))];

const PRESETS={
 A:{waveA:'sine',waveB:'triangle',octA:0,octB:12,levA:.80,levB:.35,detB:6,fType:'lowpass',cutoff:6500,res:1.2,fEnv:1200,
    atk:.004,dec:.35,sus:.18,rel:.5,lfoDest:'off',lfoRate:4,lfoDepth:.10,drive:.05,dlyTime:.22,dlyFb:.30,dlyMix:.30},
 B:{waveA:'sawtooth',waveB:'square',octA:-12,octB:0,levA:.90,levB:.70,detB:-18,fType:'lowpass',cutoff:700,res:9,fEnv:3500,
    atk:.006,dec:.80,sus:.55,rel:.35,lfoDest:'off',lfoRate:6,lfoDepth:.30,drive:.85,dlyTime:.12,dlyFb:.20,dlyMix:.12},
 C:{waveA:'square',waveB:'sawtooth',octA:0,octB:-12,levA:.55,levB:.60,detB:30,fType:'bandpass',cutoff:1400,res:14,fEnv:-1500,
    atk:.05,dec:.50,sus:.70,rel:.80,lfoDest:'cutoff',lfoRate:3.2,lfoDepth:.70,drive:.30,dlyTime:.30,dlyFb:.55,dlyMix:.35},
 D:{waveA:'triangle',waveB:'sawtooth',octA:12,octB:0,levA:.50,levB:.50,detB:12,fType:'lowpass',cutoff:2600,res:4,fEnv:5200,
    atk:.50,dec:1.10,sus:.80,rel:2.0,lfoDest:'pitch',lfoRate:.6,lfoDepth:.35,drive:.15,dlyTime:.45,dlyFb:.65,dlyMix:.50}};

/* ============================ flip engine ============================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const gumbel=u=>-Math.log(-Math.log(Math.min(1-1e-9,Math.max(1e-9,u))));

let seed=1024, rng=mulberry32(seed);
let gPar=[], gMod={};
function drawSet(){return [0,1,2,3].map(()=>gumbel(rng()));}
function reshuffleAll(){ rng=mulberry32(seed); gPar=PARAMS.map(drawSet); gMod={}; MODS.forEach(m=>gMod[m]=drawSet()); }
function reshufflePartial(frac){
  const n=Math.max(1,Math.round(PARAMS.length*frac));
  for(let k=0;k<n;k++){ const i=Math.floor(rng()*PARAMS.length); gPar[i]=drawSet(); }
  if(rng()<frac) gMod[MODS[Math.floor(rng()*MODS.length)]]=drawSet();
}
reshuffleAll();

const S={x:.5,y:.5,temp:1,coup:.3,glide:.008,contMode:'quantum',timing:'now',
         arp:true,bpm:108,vol:.7,arate:0,adepth:.25,sel:null};

function weights(x,y){ return [(1-x)*(1-y), x*(1-y), (1-x)*y, x*y]; }

function assignAt(x,y){
  const w=weights(x,y), T=Math.max(.02,S.temp), c=S.coup, out=new Array(PARAMS.length);
  const lw=w.map(v=>v>1e-9?Math.log(v)/T:-1e12);
  for(let i=0;i<PARAMS.length;i++){
    const gm=gMod[PARAMS[i].mod], gp=gPar[i];
    let best=-Infinity, bi=0;
    for(let k=0;k<4;k++){
      const s=lw[k]+(1-c)*gp[k]+c*gm[k];
      if(s>best){best=s;bi=k;}
    }
    out[i]=bi;
  }
  return out;
}

let assign=assignAt(.5,.5), committed=assign.slice(), pending=null;

function resolve(){
  const w=weights(S.x,S.y), P={};
  PARAMS.forEach((p,i)=>{
    if(p.t==='c' && S.contMode==='morph'){
      if(p.log){ let s=0; for(let k=0;k<4;k++) s+=w[k]*Math.log(PRESETS[CORNERS[k].id][p.id]); P[p.id]=Math.exp(s); }
      else { let s=0; for(let k=0;k<4;k++) s+=w[k]*PRESETS[CORNERS[k].id][p.id]; P[p.id]=s; }
    } else {
      P[p.id]=PRESETS[CORNERS[committed[i]].id][p.id];
    }
  });
  return P;
}
let P=resolve();

/* ============================ audio ============================ */
let ctx=null,master=null,busIn=null,preD=null,shaper=null,postD=null,trem=null,
    dly=null,dlyFb=null,dlyWet=null,lfo=null,lfoP=null,lfoC=null,lfoL=null;
const voices=new Map(); let voiceSeq=0;

function tanhCurve(){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(x*3)/Math.tanh(3);}return c;}

function initAudio(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain(); master.gain.value=S.vol*.35; master.connect(ctx.destination);
  busIn=ctx.createGain();
  preD=ctx.createGain(); shaper=ctx.createWaveShaper(); shaper.curve=tanhCurve(); shaper.oversample='2x'; postD=ctx.createGain();
  trem=ctx.createGain(); trem.gain.value=1;
  busIn.connect(preD); preD.connect(shaper); shaper.connect(postD); postD.connect(trem); trem.connect(master);
  dly=ctx.createDelay(1.2); dlyFb=ctx.createGain(); dlyWet=ctx.createGain();
  trem.connect(dly); dly.connect(dlyFb); dlyFb.connect(dly); dly.connect(dlyWet); dlyWet.connect(master);
  lfo=ctx.createOscillator(); lfo.type='sine';
  lfoP=ctx.createGain(); lfoC=ctx.createGain(); lfoL=ctx.createGain();
  lfoP.gain.value=0; lfoC.gain.value=0; lfoL.gain.value=0;
  lfo.connect(lfoP); lfo.connect(lfoC); lfo.connect(lfoL); lfoL.connect(trem.gain);
  lfo.start();
  pushGlobals(0);
  scheduleTimer=setInterval(scheduler,25);
  nextNoteTime=ctx.currentTime+.1;
}

function ramp(param,val,t){ const now=ctx.currentTime; param.cancelScheduledValues(now); param.setValueAtTime(param.value,now); param.linearRampToValueAtTime(val,now+Math.max(.001,t)); }

function pushGlobals(t){
  if(!ctx)return; t=t===undefined?S.glide:t;
  ramp(preD.gain, 1+P.drive*14, t);
  ramp(postD.gain, 1/(1+P.drive*7), t);
  ramp(dly.delayTime, P.dlyTime, Math.max(t,.05));
  ramp(dlyFb.gain, P.dlyFb, t);
  ramp(dlyWet.gain, P.dlyMix, t);
  ramp(lfo.frequency, P.lfoRate, t);
  ramp(lfoP.gain, P.lfoDest==='pitch'?P.lfoDepth*120:0, t);
  ramp(lfoC.gain, P.lfoDest==='cutoff'?P.lfoDepth*3200:0, t);
  ramp(lfoL.gain, P.lfoDest==='level'?P.lfoDepth*.55:0, t);
  if(P.lfoDest!=='level') ramp(trem.gain,1,t);
}
function pushVoices(t){
  if(!ctx)return; t=t===undefined?S.glide:t;
  voices.forEach(v=>{
    const c=Math.min(17000,Math.max(30,P.cutoff+P.fEnv*P.sus));
    ramp(v.filt.frequency,c,t); ramp(v.filt.Q,P.res,t);
    ramp(v.g1.gain,P.levA,t); ramp(v.g2.gain,P.levB,t);
    ramp(v.o2.detune,P.detB,t);
  });
}

function noteOn(midi,when){
  if(!ctx)return; when=when||ctx.currentTime;
  const f=440*Math.pow(2,(midi-69)/12);
  const o1=ctx.createOscillator(), o2=ctx.createOscillator();
  o1.type=P.waveA; o2.type=P.waveB;
  o1.frequency.value=f*Math.pow(2,P.octA/12); o2.frequency.value=f*Math.pow(2,P.octB/12);
  o2.detune.value=P.detB;
  const g1=ctx.createGain(), g2=ctx.createGain(); g1.gain.value=P.levA; g2.gain.value=P.levB;
  const filt=ctx.createBiquadFilter(); filt.type=P.fType; filt.Q.value=P.res;
  const vca=ctx.createGain(); vca.gain.value=0;
  o1.connect(g1); o2.connect(g2); g1.connect(filt); g2.connect(filt); filt.connect(vca); vca.connect(busIn);
  lfoP.connect(o1.detune); lfoP.connect(o2.detune); lfoC.connect(filt.frequency);

  const cl=v=>Math.min(17000,Math.max(30,v));
  filt.frequency.setValueAtTime(cl(P.cutoff),when);
  filt.frequency.linearRampToValueAtTime(cl(P.cutoff+P.fEnv),when+P.atk);
  filt.frequency.linearRampToValueAtTime(cl(P.cutoff+P.fEnv*P.sus),when+P.atk+P.dec);
  vca.gain.setValueAtTime(0,when);
  vca.gain.linearRampToValueAtTime(.55,when+P.atk);
  vca.gain.linearRampToValueAtTime(.55*Math.max(.001,P.sus),when+P.atk+P.dec);
  o1.start(when); o2.start(when);
  const id=++voiceSeq;
  const v={id,o1,o2,g1,g2,filt,vca,rel:P.rel};
  voices.set(id,v);
  if(voices.size>10){ const k=voices.keys().next().value; noteOff(k); }
  return id;
}
function noteOff(id,when){
  const v=voices.get(id); if(!v)return; voices.delete(id);
  const t=when||ctx.currentTime;
  v.vca.gain.cancelScheduledValues(t);
  v.vca.gain.setValueAtTime(Math.max(.0001,v.vca.gain.value),t);
  v.vca.gain.exponentialRampToValueAtTime(.0001,t+v.rel);
  v.o1.stop(t+v.rel+.05); v.o2.stop(t+v.rel+.05);
  setTimeout(()=>{try{v.filt.disconnect();v.vca.disconnect();}catch(e){}},(v.rel+.4)*1000);
}

/* held / arp */
const held=[];            // midi numbers, latched
const sustained=new Map();// midi -> voice id (arp off)
let nextNoteTime=0, arpIdx=0, scheduleTimer=null;
function scheduler(){
  if(!ctx||!S.arp)return;
  const step=60/S.bpm/2; // eighths
  while(nextNoteTime<ctx.currentTime+.12){
    if(held.length){
      if(pending){ commit(pending); pending=null; renderPending(); }
      const m=held[arpIdx%held.length]; arpIdx++;
      const id=noteOn(m,nextNoteTime);
      const gate=step*.85, off=nextNoteTime+gate;
      setTimeout(()=>noteOff(id,ctx.currentTime),(off-ctx.currentTime)*1000);
    }
    nextNoteTime+=step;
  }
  if(nextNoteTime<ctx.currentTime) nextNoteTime=ctx.currentTime+.05;
}
function retriggerSustained(){
  if(S.arp)return;
  sustained.forEach((id,m)=>{ noteOff(id); sustained.set(m,noteOn(m)); });
}

/* ============================ commit / flash ============================ */
function commit(next){
  const changed=[];
  for(let i=0;i<next.length;i++) if(next[i]!==committed[i]) changed.push(i);
  committed=next.slice();
  P=resolve();
  pushGlobals(); pushVoices();
  changed.forEach(i=>flash(i));
  renderChips(); renderCensus();
  if(changed.length && !S.arp && changed.some(i=>PARAMS[i].t==='d')) retriggerSustained();
}
function update(){
  assign=assignAt(S.x,S.y);
  if(S.timing==='note' && S.arp && held.length){
    const diff=assign.some((v,i)=>v!==committed[i]);
    pending=diff?assign.slice():null; renderPending();
    if(S.contMode==='morph'){ P=resolve(); pushGlobals(); pushVoices(); renderChips(); }
  } else {
    commit(assign);
  }
  draw();
}

/* ============================ UI ============================ */
const $=s=>document.querySelector(s);
const rack=$('#rack'), chips={};
MODS.forEach(m=>{
  const g=document.createElement('div'); g.className='group';
  g.innerHTML='<div class="gname">'+m+'</div>';
  PARAMS.forEach((p,i)=>{ if(p.mod!==m)return;
    const c=document.createElement('div'); c.className='chip'; c.tabIndex=0;
    c.innerHTML='<span class="n">'+p.label+'</span><span class="v"></span>';
    c.onclick=()=>{S.sel=(S.sel===i?null:i); buildTerritory(); renderChips(); draw();};
    c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();c.click();}};
    g.appendChild(c); chips[i]=c;});
  rack.appendChild(g);
});
function flash(i){const c=chips[i];c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');}
function renderChips(){
  const w=weights(S.x,S.y);
  PARAMS.forEach((p,i)=>{
    const c=chips[i], v=P[p.id];
    c.querySelector('.v').textContent=p.fmt?p.fmt(v):String(v);
    const blend=(p.t==='c'&&S.contMode==='morph');
    const dom=blend?w.indexOf(Math.max(...w)):committed[i];
    c.style.borderLeftColor=CORNERS[dom].color;
    c.style.opacity=blend?.62:1;
    c.querySelector('.v').style.color=blend?'var(--muted)':CORNERS[dom].color;
    c.dataset.sel=(S.sel===i);
  });
}
const census=$('#census');
CORNERS.forEach(c=>{const d=document.createElement('div');d.style.background=c.color;census.appendChild(d);});
$('#legend').innerHTML=CORNERS.map(c=>'<span><i class="dot" style="background:'+c.color+'"></i><b>'+c.id+'</b> '+c.name+'</span>').join('');
function renderCensus(){
  const n=[0,0,0,0]; committed.forEach(k=>n[k]++);
  [...census.children].forEach((d,k)=>{const pc=n[k]/PARAMS.length;d.style.width=(pc*100)+'%';d.textContent=pc>.10?Math.round(pc*100)+'%':'';});
}
function renderPending(){ $('#pend').textContent=pending?('⟳ '+pending.filter((v,i)=>v!==committed[i]).length+' flips queued for next note'):''; }

/* pad */
const cv=$('#pad'), g2d=cv.getContext('2d');
let terr=null;
function buildTerritory(){
  if(S.sel===null){terr=null;$('#terrlbl').textContent='';return;}
  const p=PARAMS[S.sel], N=56, m=new Uint8Array(N*N);
  const T=Math.max(.02,S.temp), c=S.coup, gm=gMod[p.mod], gp=gPar[S.sel];
  for(let yi=0;yi<N;yi++)for(let xi=0;xi<N;xi++){
    const x=(xi+.5)/N,y=(yi+.5)/N,w=weights(x,y);
    let best=-Infinity,bi=0;
    for(let k=0;k<4;k++){const s=(w[k]>1e-9?Math.log(w[k])/T:-1e12)+(1-c)*gp[k]+c*gm[k];if(s>best){best=s;bi=k;}}
    m[yi*N+xi]=bi;
  }
  terr={m,N}; $('#terrlbl').textContent='territory: '+p.mod.toLowerCase()+' · '+p.label;
}
function draw(){
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  cv.width=r.width*dpr; cv.height=r.height*dpr; g2d.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height;
  g2d.fillStyle='#0d0c11'; g2d.fillRect(0,0,W,H);
  if(terr){
    const N=terr.N, cw=W/N, ch=H/N;
    g2d.globalAlpha=.30;
    for(let yi=0;yi<N;yi++)for(let xi=0;xi<N;xi++){
      g2d.fillStyle=CORNERS[terr.m[yi*N+xi]].color;
      g2d.fillRect(xi*cw-.5,yi*ch-.5,cw+1,ch+1);
    }
    g2d.globalAlpha=1;
  }
  // corner wash
  const pos=[[0,0],[W,0],[0,H],[W,H]];
  CORNERS.forEach((c,k)=>{
    const gr=g2d.createRadialGradient(pos[k][0],pos[k][1],0,pos[k][0],pos[k][1],W*.62);
    gr.addColorStop(0,c.color+(terr?'22':'33')); gr.addColorStop(1,c.color+'00');
    g2d.fillStyle=gr; g2d.fillRect(0,0,W,H);
  });
  g2d.strokeStyle='#332f3f'; g2d.lineWidth=1;
  g2d.beginPath(); g2d.moveTo(W/2,0); g2d.lineTo(W/2,H); g2d.moveTo(0,H/2); g2d.lineTo(W,H/2); g2d.stroke();
  g2d.strokeRect(.5,.5,W-1,H-1);
  // labels
  g2d.font='500 10px "IBM Plex Mono",monospace';
  const lb=[[10,20,'left'],[W-10,20,'right'],[10,H-10,'left'],[W-10,H-10,'right']];
  CORNERS.forEach((c,k)=>{g2d.fillStyle=c.color;g2d.textAlign=lb[k][2];g2d.fillText(c.id+' · '+c.name,lb[k][0],lb[k][1]);});
  // cursor
  const x=S.x*W,y=S.y*H;
  g2d.strokeStyle='rgba(255,255,255,.30)'; g2d.beginPath(); g2d.arc(x,y,15,0,7); g2d.stroke();
  g2d.fillStyle='#fff'; g2d.beginPath(); g2d.arc(x,y,4,0,7); g2d.fill();
}
function padXY(e){const r=cv.getBoundingClientRect();S.x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));S.y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));update();}
let dragging=false;
cv.addEventListener('pointerdown',e=>{dragging=true;cv.setPointerCapture(e.pointerId);padXY(e);});
cv.addEventListener('pointermove',e=>{if(dragging)padXY(e);});
cv.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('resize',draw);

/* keys */
const KEYNAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const keysEl=$('#keys'), keyBtns={};
for(let m=48;m<=72;m++){
  const b=document.createElement('button'); b.className='key'+(KEYNAMES[m%12].includes('#')?' blk':'');
  b.setAttribute('aria-pressed','false'); b.setAttribute('aria-label',KEYNAMES[m%12]+Math.floor(m/12-1));
  b.onclick=()=>toggleNote(m); keysEl.appendChild(b); keyBtns[m]=b;
}
function toggleNote(m){
  if(ctx&&ctx.state==='suspended')ctx.resume();
  const i=held.indexOf(m);
  if(i>=0){ held.splice(i,1); keyBtns[m].setAttribute('aria-pressed','false');
    if(sustained.has(m)){noteOff(sustained.get(m));sustained.delete(m);} }
  else { held.push(m); held.sort((a,b)=>a-b); keyBtns[m].setAttribute('aria-pressed','true');
    if(!S.arp&&ctx) sustained.set(m,noteOn(m)); }
}
const KMAP={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72};
window.addEventListener('keydown',e=>{
  if(e.repeat||e.target.tagName==='INPUT')return;
  if(KMAP[e.key]!==undefined){e.preventDefault();toggleNote(KMAP[e.key]);}
  if(e.key==='r'){doReshuffle();}
});

/* controls */
function seg(id,cb){ const el=$(id); el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); cb(b.dataset.v); }); }
$('#temp').oninput=e=>{S.temp=+e.target.value;$('#tv').textContent=S.temp.toFixed(2);buildTerritory();update();};
$('#coup').oninput=e=>{S.coup=+e.target.value;$('#cv').textContent=Math.round(S.coup*100)+'%';buildTerritory();update();};
$('#glide').oninput=e=>{S.glide=+e.target.value/1000;$('#gv').textContent=e.target.value+' ms';};
seg('#contmode',v=>{S.contMode=v;P=resolve();pushGlobals();pushVoices();renderChips();});
seg('#timing',v=>{S.timing=v;if(v==='now'&&pending){commit(pending);pending=null;renderPending();}});
seg('#arp',v=>{S.arp=(v==='on');
  if(S.arp){ sustained.forEach(id=>noteOff(id)); sustained.clear(); if(ctx)nextNoteTime=ctx.currentTime+.05; }
  else { if(pending){commit(pending);pending=null;renderPending();} if(ctx)held.forEach(m=>sustained.set(m,noteOn(m))); }});
$('#bpm').oninput=e=>{S.bpm=+e.target.value;$('#bv').textContent=S.bpm+' bpm';};
$('#vol').oninput=e=>{S.vol=+e.target.value;$('#vv').textContent=Math.round(S.vol*100)+'%';if(master)master.gain.value=S.vol*.35;};
$('#adepth').oninput=e=>{S.adepth=+e.target.value;$('#advv').textContent=Math.round(S.adepth*100)+'%';};
$('#arate').oninput=e=>{S.arate=+e.target.value;$('#arv').textContent=S.arate?('every '+(1/ (S.arate/4) ).toFixed(1)+'s'):'off';};
$('#panic').onclick=()=>{held.slice().forEach(toggleNote);voices.forEach((v,k)=>noteOff(k));};
function doReshuffle(){ seed=(Math.random()*100000)|0; $('#seedv').textContent=seed; reshuffleAll(); buildTerritory(); update(); }
$('#reshuffle').onclick=doReshuffle;
$('#start').onclick=e=>{ if(!ctx){initAudio();e.target.textContent='Audio running';e.target.disabled=true;} };

let autoAcc=0;
setInterval(()=>{
  if(!S.arate){autoAcc=0;return;}
  autoAcc+=0.25;
  if(autoAcc>=4/S.arate){ autoAcc=0; reshufflePartial(S.adepth); buildTerritory(); update(); }
},250);

renderChips(); renderCensus(); draw();
</script>
